
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ItsChai | My World</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #070b16;
  color: #e8edff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.profile {
  width: 100%;
  max-width: 430px;
  padding: 35px 25px;
  text-align: center;
  background: #101a30;
  border: 1px solid #263c65;
  border-radius: 22px;
  box-shadow: 0 0 35px #153b7950;
  animation: appear 1s ease;
}

.avatar {
  width: 110px;
  height: 110px;
  margin: auto;
  border-radius: 50%;
  background: linear-gradient(135deg, #172b55, #496eea);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 42px;
  box-shadow: 0 0 25px #456bdf70;
}

h1 {
  margin-bottom: 8px;
  color: #a9c2ff;
}

.subtitle {
  color: #8c9cbd;
  font-size: 14px;
}

.description {
  line-height: 1.7;
  margin: 25px 0;
  color: #cbd6ef;
}

.link {
  display: block;
  padding: 13px;
  margin-top: 12px;
  border-radius: 12px;
  background: #1c3157;
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.link:hover {
  background: #3459a0;
  transform: translateY(-3px);
}

footer {
  margin-top: 28px;
  color: #7082a8;
  font-size: 12px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="profile">

  <div class="avatar">✦</div>

  <h1>ItsChai</h1>

  <div class="subtitle">Welcome to my little world ♡</div>

  <div class="description">
    Привет! Я Chai.
    <br>
    Здесь находится мой маленький уголок интернета.
    <br><br>
    Люблю рисование, творчество и создание персонажей.
  </div>

  <a class="link" href="https://t.me/">Telegram</a>

  <a class="link" href="https://youtube.com/">YouTube</a>

  <footer>© 2026 ItsChai · Made with love</footer>

</div>

</body>
</html>
